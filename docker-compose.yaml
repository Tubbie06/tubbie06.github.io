services:
  site:
    image: ruby:3.3-bookworm
    working_dir: /srv/jekyll
    ports:
      - "4000:4000"
      - "35729:35729"
    environment:
      - JEKYLL_ENV=development
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    command: >
      bash -lc "
        gem install bundler &&
        bundle install &&
        bundle exec jekyll serve
          --host 0.0.0.0
          --livereload
          --force_polling
          --baseurl ''
      "

volumes:
  bundle_cache: