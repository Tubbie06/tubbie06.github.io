---
layout: default
---

<div id="main" role="main">
  {% include sidebar.html %}

  <div class="archive">
    {% if page.publication_filters %}
      <div class="pub-page-header">
        <h1 class="page__title">{{ page.title }}</h1>
        <div class="pub-filters" role="group" aria-label="Filter publications by type" hidden>
          <button type="button"
                  class="pub-badge pub-badge--other pub-filter"
                  data-pub-filter=""
                  aria-controls="publication-list"
                  aria-pressed="true"
                  title="Show all publications">All</button>
          {% assign filter_categories = "article,preprint,thesis" | split: "," %}
          {% for category in filter_categories %}
            <button type="button"
                    class="pub-badge pub-badge--{{ category }} pub-filter"
                    data-pub-filter="{{ category }}"
                    aria-controls="publication-list"
                    aria-pressed="false"
                    title="Show {{ site.publication_category[category].title }}; click again to show all publications">{{ site.publication_category[category].title }}</button>
          {% endfor %}
        </div>
      </div>
    {% else %}
      <h1 class="page__title">{{ page.title }}</h1>
    {% endif %}
    {{ content }}
  </div>
</div>
